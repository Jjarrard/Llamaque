<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app" role="main">
  <h1 id="appTitle">Pomodoro timer</h1>
  <section id="timerSection" aria-labelledby="appTitle">
    <div id="timeDisplay" role="timer" aria-live="polite">25:00</div>
    <button id="startButton" aria-label="Start Timer">Start</button>
    <button id="stopButton" aria-label="Stop Timer">Stop</button>
    <button id="resetButton" aria-label="Reset Timer">Reset</button>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
