<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>todo app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header>
      <h1 id="appTitle">todo app</h1>
    </header>
    <section id="inputSection">
      <form id="primaryForm">
        <input id="primaryInput" type="text" placeholder="Enter todo...">
        <button id="primaryActionButton" type="submit">Add</button>
      </form>
    </section>
    <section id="filterSection">
      <div id="filterControls">
        <ul id="itemsList"></ul>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
