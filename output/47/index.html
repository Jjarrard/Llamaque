<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kanban board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1 id="appTitle">kanban board</h1>
    <form id="primaryForm">
      <input id="primaryInput" type="text" placeholder="Enter task...">
      <button id="primaryActionButton" type="submit">Add</button>
    </form>
    <div id="kanbanBoard">
      <section id="backlog">
        <h2>Backlog</h2>
        <ul id="backlogList"></ul>
      </section>
      <section id="inProgress">
        <h2>In Progress</h2>
        <ul id="inProgressList"></ul>
      </section>
      <section id="qa">
        <h2>QA</h2>
        <ul id="qaList"></ul>
      </section>
      <section id="done">
        <h2>Done</h2>
        <ul id="doneList"></ul>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
