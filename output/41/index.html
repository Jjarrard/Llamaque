<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pomodoro app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">  
    <h1 id="appTitle">pomodoro app</h1>
    <form id="primaryForm">
      <input id="primaryInput" type="text" placeholder="Enter pomodoro...">
      <label for="focusDuration">Focus Duration (minutes):</label>
      <input id="focusDuration" type="number" value="25">
      <label for="breakDuration">Break Duration (minutes):</label>
      <input id="breakDuration" type="number" value="5">
      <button id="primaryActionButton" type="submit">Add</button>
    </form>
    <section id="notifications">
      <div id="notificationArea"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
