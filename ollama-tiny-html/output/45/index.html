<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1 id="appTitle">Password Generator</h1>
    <form id="primaryForm">
      <input id="passwordLengthInput" type="number" placeholder="Password length">
      <div>
        <label>
          <input type="checkbox" id="includeLetters">
          Letters
        </label>
        <label>
          <input type="checkbox" id="includeNumbers">
          Numbers
        </label>
        <label>
          <input type="checkbox" id="includeSymbols">
          Symbols
        </label>
      </div>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
